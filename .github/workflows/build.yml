name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BtSyncReset.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BtSyncReset-apk
          path: BtSyncReset.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BT Sync Reset (build ${{ github.run_number }})
          body: |
            Download **BtSyncReset.apk** below and open it on your phone to install.
          files: BtSyncReset.apk
          make_latest: true
